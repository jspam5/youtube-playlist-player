<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist Player</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    iframe {
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="player"></div>

  <script>
    const PLAYLIST_ID = "PL_0qstDTXacaJx6V3ycEk4C-xHf6zAt5_";

    let player;
    let shuffleEnabled = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",

        playerVars: {
          autoplay: 1,
          controls: 0,
          playsinline: 1,
          mute: 0,
          cc_load_policy: 0,
          modestbranding: 1,
          rel: 0,
          iv_load_policy: 3,
          origin: window.location.origin
        },

        events: {
          onReady: onPlayerReady,
          onError: onPlayerError,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      player.unMute();

      player.loadPlaylist({
        listType: "playlist",
        list: PLAYLIST_ID,
        index: 0
      });

      player.setLoop(true);
    }

    function onPlayerError(event) {
      console.error("YouTube error:", event.data);
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {

        if (!shuffleEnabled) {
          player.setShuffle(true);
          shuffleEnabled = true;
        }

        player.unloadModule("captions");
      }
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
