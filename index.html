<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Twitch Playlist Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #vod-info {
      position: fixed;
      left: 20px;
      bottom: 20px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      border-radius: 6px;
      display: none;
      z-index: 10;
    }

    #vod-info a {
      color: #9bd0ff;
      display: block;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div id="player"></div>

  <div id="vod-info">
    <span id="vod-title"></span>
    <a href="https://youtube.com/@JacobStreamsVODS"
       target="_blank" rel="noopener noreferrer">
      youtube.com/@JacobStreamsVODS
    </a>
  </div>

  <script>
    const PLAYLIST_ID = "PL_0qstDTXacaJx6V3ycEk4C-xHf6zAt5_";
    const TWITCH_CHANNEL = "jstreamsbot";

    let player;
    let shuffleEnabled = true;
    let shuffleApplied = false;
    let lastVideoId = null;
    let vodTimeout = null;

    const ytScript = document.createElement("script");
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          mute: 0,
          playsinline: 1,
          rel: 0,
          iv_load_policy: 3,
          cc_load_policy: 0
        },
        events: {
          onReady: function(event) {
            event.target.loadPlaylist({
              listType: "playlist",
              list: PLAYLIST_ID,
              index: 0
            });
            event.target.setLoop(true);
          },
          onStateChange: onPlayerStateChange
        }
      });
    }

    function hideVodInfo() {
      document.getElementById("vod-info").style.display = "none";

      if (vodTimeout) {
        clearTimeout(vodTimeout);
        vodTimeout = null;
      }
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        const video = player.getVideoData();

        if (video && video.video_id) {
          if (lastVideoId !== null && video.video_id !== lastVideoId) {
            hideVodInfo();
          }

          lastVideoId = video.video_id;
        }

        if (!shuffleApplied) {
          if (shuffleEnabled) {
            player.setShuffle(true);
          }
          shuffleApplied = true;
        }
      }
    }

    function showCurrentVod() {
      if (!player || !player.getVideoData) return;

      const video = player.getVideoData();
      if (!video || !video.video_id) return;

      document.getElementById("vod-title").textContent = video.title;
      document.getElementById("vod-info").style.display = "block";

      if (vodTimeout) {
        clearTimeout(vodTimeout);
      }

      vodTimeout = setTimeout(function() {
        hideVodInfo();
      }, 10000);
    }

    // Check whether a Twitch user is the broadcaster or a moderator
    function isModeratorOrBroadcaster(line, username, tags) {
      const badges = tags.badges || "";
      const userType = tags["user-type"] || "";

      return (
        username.toLowerCase() === TWITCH_CHANNEL ||
        badges.split(",").some(function(badge) {
          return badge.startsWith("broadcaster/") ||
                 badge.startsWith("moderator/");
        }) ||
        userType === "mod"
      );
    }

    // Anonymous Twitch chat connection
    const socket = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    socket.onopen = function() {
      console.log("Connected to Twitch chat anonymously");

      socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands twitch.tv/membership");
      socket.send("PASS SCHMOOPIIE");
      socket.send("NICK justinfan" + Math.floor(Math.random() * 90000 + 10000));
      socket.send("JOIN #" + TWITCH_CHANNEL);
    };

    socket.onmessage = function(event) {
      const lines = event.data.split("\r\n");

      lines.forEach(function(line) {
        if (!line) return;

        if (line.startsWith("PING")) {
          socket.send("PONG :tmi.twitch.tv");
          return;
        }

        // Extract Twitch message tags
        let tags = {};

        if (line.startsWith("@")) {
          const tagSection = line.substring(1, line.indexOf(" "));
          tagSection.split(";").forEach(function(tag) {
            const parts = tag.split("=");
            tags[parts[0]] = parts[1] || "";
          });
        }

        // Extract username and chat message
        const messageMatch = line.match(/:([^!]+)!.* PRIVMSG #\w+ :(.*)$/i);
        if (!messageMatch) return;

        const username = messageMatch[1].toLowerCase();
        const message = messageMatch[2].trim().toLowerCase();

        if (!player || !player.playVideo) return;

        // !vod remains available to everyone
        if (message === "!vod") {
          showCurrentVod();
          return;
        }

        // All playback commands require broadcaster or moderator
        if (!isModeratorOrBroadcaster(line, username, tags)) {
          return;
        }

        if (message === "!play") {
          player.playVideo();
        }

        if (message === "!pause") {
          player.pauseVideo();
        }

        if (message === "!skip") {
          player.nextVideo();
        }

        if (message === "!shuffle") {
          shuffleEnabled = !shuffleEnabled;
          shuffleApplied = false;
          player.setShuffle(shuffleEnabled);
        }
      });
    };

    socket.onerror = function(error) {
      console.log("Twitch chat connection error:", error);
    };

    socket.onclose = function() {
      console.log("Twitch chat connection closed");
    };
  </script>

</body>
</html>
