<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Playlist Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,.7);
      padding: 8px 12px;
      font: 14px Arial, sans-serif;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="status">Connecting to YouTube...</div>
  <div id="player"></div>

  <script>
    const PLAYLIST_ID = "PL_0qstDTXacaJx6V3ycEk4C-xHf6zAt5_";
    let player;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: onPlayerReady,
          onError: onPlayerError,
          onStateChange: onPlayerStateChange
        }
      });
    }

    function onPlayerReady() {
      document.getElementById("status").textContent =
        "Loading playlist...";

      player.loadPlaylist({
        listType: "playlist",
        list: PLAYLIST_ID,
        index: 0
      });

      player.setShuffle(true);
      player.setLoop(true);
    }

    function onPlayerError(event) {
      document.getElementById("status").textContent =
        "YouTube error: " + event.data;
    }

    function onPlayerStateChange(event) {
      const status = document.getElementById("status");

      if (event.data === YT.PlayerState.PLAYING) {
        status.textContent = "Playing playlist";
      } else if (event.data === YT.PlayerState.PAUSED) {
        status.textContent = "Paused";
      } else if (event.data === YT.PlayerState.ENDED) {
        status.textContent = "Video ended";
      }
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
